name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

env:
  API_URL: "https://prxwe.ir/chatline_api.php"
  APP_NAME: "Chatline"
  APP_ID: "com.webapp.chatline"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Build APK
        run: |
          set -e
          for f in ScreenGuardPlugin.java MainActivity.java google-services.json tg-home.js; do test -f "$f"; done
          HTML=$(ls *.html | head -n 1)
          echo "Using $HTML"
          mkdir -p www
          cp "$HTML" www/index.html
          # API address + Telegram-style home screen / push code
          python3 - <<'PY'
          import os
          p='www/index.html'
          s=open(p,encoding='utf8').read()
          api=os.environ['API_URL']
          s=s.replace('<head>','<head><script>window.CL_API="'+api+'"</script>',1)
          if 'id="tg-home"' not in s:
              js=open('tg-home.js',encoding='utf8').read()
              i=s.rfind('</body>')
              tag='<script id="tg-home">'+js+'</script>'
              s=(s[:i]+tag+s[i:]) if i>=0 else s+tag
          open(p,'w',encoding='utf8').write(s)
          PY
          grep -c "window.CL_API=" www/index.html
          grep -c 'id="tg-home"' www/index.html
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/push-notifications@6
          echo "{\"appId\":\"$APP_ID\",\"appName\":\"$APP_NAME\",\"webDir\":\"www\",\"plugins\":{\"PushNotifications\":{\"presentationOptions\":[\"badge\",\"sound\",\"alert\"]}}}" > capacitor.config.json
          npx cap add android
          JDIR=android/app/src/main/java/$(echo $APP_ID | tr . /)
          mkdir -p "$JDIR"
          cp ScreenGuardPlugin.java MainActivity.java "$JDIR/"
          sed -i "s/^package .*/package $APP_ID;/" "$JDIR/ScreenGuardPlugin.java" "$JDIR/MainActivity.java"
          # Firebase (push notifications)
          cp google-services.json android/app/google-services.json
          grep -q "google-services" android/build.gradle || sed -i "s#classpath 'com.android.tools.build:gradle:\([^']*\)'#&\n        classpath 'com.google.gms:google-services:4.4.2'#" android/build.gradle
          MANIFEST=android/app/src/main/AndroidManifest.xml
          grep -q POST_NOTIFICATIONS $MANIFEST || sed -i 's#</manifest>#    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n</manifest>#' $MANIFEST
          # app icon: the first image file in the repo root (png/jpg/webp), except icon.png; then icon.png; then the ICON inside the html
          ICON_SRC=""
          for f in *; do
            [ -f "$f" ] || continue
            [ "$f" = "icon.png" ] && continue
            if file -b --mime-type "$f" | grep -q '^image/'; then ICON_SRC="$f"; break; fi
          done
          if [ -z "$ICON_SRC" ]; then ICON_SRC=icon.png; fi
          if [ ! -f "$ICON_SRC" ]; then
            python3 - <<'PY'
          import re,base64
          s=open('www/index.html',encoding='utf8').read()
          m=re.search(r'ICON="data:image/png;base64,([A-Za-z0-9+/=]+)"',s)
          open('icon.png','wb').write(base64.b64decode(m.group(1)))
          PY
            ICON_SRC=icon.png
          fi
          echo "Icon source: $ICON_SRC"
          RES=android/app/src/main/res
          rm -rf $RES/mipmap-anydpi-v26
          for d in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            n=${d%%:*}; px=${d##*:}
            mkdir -p $RES/mipmap-$n
            convert "${ICON_SRC}[0]" -background none -resize ${px}x${px}^ -gravity center -extent ${px}x${px} $RES/mipmap-$n/ic_launcher.png
            cp $RES/mipmap-$n/ic_launcher.png $RES/mipmap-$n/ic_launcher_round.png
            cp $RES/mipmap-$n/ic_launcher.png $RES/mipmap-$n/ic_launcher_foreground.png
          done
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../chatline.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Chatline ${{ github.run_number }}
          files: chatline.apk
          fail_on_unmatched_files: true
