name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

env:
  API_URL: "https://prxwe.ir/chatline_api.php"
  APP_NAME: "Chatline"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Build APK
        run: |
          set -e
          test -f ScreenGuardPlugin.java
          test -f MainActivity.java
          HTML=$(ls *.html | head -n 1)
          echo "Using $HTML"
          mkdir -p www
          cp "$HTML" www/index.html
          sed -i "0,/<head>/s|<head>|<head><script>window.CL_API='$API_URL'</script>|" www/index.html
          grep -c "window.CL_API=" www/index.html
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          echo "{\"appId\":\"com.chatline.app\",\"appName\":\"$APP_NAME\",\"webDir\":\"www\"}" > capacitor.config.json
          npx cap add android
          cp ScreenGuardPlugin.java MainActivity.java android/app/src/main/java/com/chatline/app/
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../chatline.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Chatline ${{ github.run_number }}
          files: chatline.apk
          fail_on_unmatched_files: true
