name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

env:
  API_URL: "https://prxwe.ir/chatline_api.php"
  APP_NAME: "Chatline"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Build APK
        run: |
          set -e
          test -f ScreenGuardPlugin.java
          test -f MainActivity.java
          HTML=$(ls *.html | head -n 1)
          echo "Using $HTML"
          mkdir -p www
          cp "$HTML" www/index.html
          sed -i "0,/<head>/s|<head>|<head><script>window.CL_API='$API_URL'</script>|" www/index.html
          grep -c "window.CL_API=" www/index.html
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          echo "{\"appId\":\"com.chatline.app\",\"appName\":\"$APP_NAME\",\"webDir\":\"www\"}" > capacitor.config.json
          npx cap add android
          IMG=$(ls *.png *.jpg *.jpeg *.webp 2>/dev/null | head -n 1 || true)
          if [ -n "$IMG" ]; then
            echo "Icon: $IMG"
            RES=android/app/src/main/res
            convert "$IMG" -gravity center -crop 88%x88%+0+0 +repage -resize 1024x1024^ -extent 1024x1024 icon_clean.png
            mkdir -p $RES/mipmap-anydpi-v26
            printf '<?xml version="1.0" encoding="utf-8"?>\n<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">\n  <background android:drawable="@mipmap/ic_bg"/>\n  <foreground android:drawable="@mipmap/ic_fg"/>\n</adaptive-icon>\n' > $RES/mipmap-anydpi-v26/ic_launcher.xml
            cp $RES/mipmap-anydpi-v26/ic_launcher.xml $RES/mipmap-anydpi-v26/ic_launcher_round.xml
            for P in mdpi:48:108 hdpi:72:162 xhdpi:96:216 xxhdpi:144:324 xxxhdpi:192:432; do
              D=$(echo $P | cut -d: -f1); L=$(echo $P | cut -d: -f2); A=$(echo $P | cut -d: -f3)
              F=$((A*2/3))
              for N in ic_launcher ic_launcher_round; do
                convert icon_clean.png -resize ${L}x${L} $RES/mipmap-$D/$N.png
              done
              convert icon_clean.png -resize ${F}x${F} -background none -gravity center -extent ${A}x${A} $RES/mipmap-$D/ic_fg.png
              convert icon_clean.png -resize ${A}x${A}^ -gravity center -extent ${A}x${A} -blur 0x6 $RES/mipmap-$D/ic_bg.png
            done
          fi
          cp ScreenGuardPlugin.java MainActivity.java android/app/src/main/java/com/chatline/app/
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../chatline.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Chatline ${{ github.run_number }}
          files: chatline.apk
          fail_on_unmatched_files: true
