name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

env:
  API_URL: "https://prxwe.ir/chatline_api.php"
  APP_NAME: "Chatline"
  APP_ID: "com.webapp.chatline"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Build APK
        run: |
          set -e
          for f in ScreenGuardPlugin.java MainActivity.java google-services.json tg-home.js; do test -f "$f"; done
          HTML=$(ls *.html | head -n 1)
          echo "Using $HTML"
          mkdir -p www
          cp "$HTML" www/index.html
          # API address + Telegram-style home screen / push code
          python3 - <<'PY'
          import os
          p='www/index.html'
          s=open(p,encoding='utf8').read()
          api=os.environ['API_URL']
          s=s.replace('<head>','<head><script>window.CL_API="'+api+'"</script>',1)
          if 'id="tg-home"' not in s:
              js=open('tg-home.js',encoding='utf8').read()
              i=s.rfind('</body>')
              tag='<script id="tg-home">'+js+'</script>'
              s=(s[:i]+tag+s[i:]) if i>=0 else s+tag
          open(p,'w',encoding='utf8').write(s)
          PY
          grep -c "window.CL_API=" www/index.html
          grep -c 'id="tg-home"' www/index.html
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/push-notifications@6
          echo "{\"appId\":\"$APP_ID\",\"appName\":\"$APP_NAME\",\"webDir\":\"www\",\"plugins\":{\"PushNotifications\":{\"presentationOptions\":[\"badge\",\"sound\",\"alert\"]}}}" > capacitor.config.json
          npx cap add android
          JDIR=android/app/src/main/java/$(echo $APP_ID | tr . /)
          mkdir -p "$JDIR"
          cp ScreenGuardPlugin.java MainActivity.java "$JDIR/"
